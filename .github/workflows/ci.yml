name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - api-gateway
          - services/user-service
          - services/catalog-service
          - services/order-service
          - services/payment-service
          - services/delivery-service
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.app }}/pom.xml


      - name: Build and test
        run: ./mvnw -B -ntp verify

  python:
    name: Python (route-intelligence-service)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/route-intelligence-service
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: services/route-intelligence-service/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked python -m ruff check .

      - name: Check formatting
        run: uv run --locked python -m ruff format --check .

      - name: Test
        run: uv run --locked python -m pytest

  frontend:
    name: Frontend (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build

  e2e:
    name: End to end (Compose demo)
    needs: [java, python, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Create the demo environment
        run: |
          cp .env.example .env
          scripts/initialize-auth-secret.sh

      - name: Train the route model
        shell: pwsh
        run: scripts/prepare-route-model.ps1

      - name: Start the demo
        run: docker compose --profile demo up -d --build --wait --wait-timeout 600

      - name: Smoke with broker and Python downtime, then container recreation
        shell: pwsh
        run: scripts/smoke-route-demo.ps1 -CheckRecovery -CheckPersistence

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the browser tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check the browser tests
        working-directory: e2e
        run: npm run typecheck

      - name: Browser tests
        working-directory: e2e
        run: npm test

      - name: Service logs
        if: failure()
        run: docker compose --profile demo logs --no-color --timestamps

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
