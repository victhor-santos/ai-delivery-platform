name: ai-delivery-platform

x-java-build: &java-build
  context: .
  dockerfile: Dockerfile.java

x-java-service: &java-service
  profiles: [demo]

x-java-environment: &java-environment
  JAVA_TOOL_OPTIONS: ${DEMO_JAVA_TOOL_OPTIONS:--Xms64m -Xmx384m -XX:ActiveProcessorCount=2}

services:
  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${CATALOG_DB_USERNAME:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CATALOG_DB_PORT:-5432}:5432"
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ${ORDER_DB_USERNAME:-orders}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ORDER_DB_PORT:-5434}:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  delivery-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deliveries
      POSTGRES_USER: ${DELIVERY_DB_USERNAME:-deliveries}
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASSWORD:?Set DELIVERY_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DELIVERY_DB_PORT:-5435}:5432"
    volumes:
      - delivery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ${USER_DB_USERNAME:-users}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${USER_DB_PORT:-5436}:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  payment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: ${PAYMENT_DB_USERNAME:-payments}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT:-5437}:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # A fixed hostname keeps the node name, and so its stored queues and messages, across container recreation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-delivery}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  user-service:
    <<: *java-service
    image: delivery-order-system/user-service:local
    build:
      <<: *java-build
      args:
        SERVICE_PATH: services/user-service
    environment:
      <<: *java-environment
      SERVER_PORT: 8081
      USER_DB_URL: jdbc:postgresql://user-db:5432/users
      USER_DB_USERNAME: ${USER_DB_USERNAME:-users}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      USER_AUTH_PRIVATE_KEY: ${USER_AUTH_PRIVATE_KEY:?Generate USER_AUTH_PRIVATE_KEY with scripts/initialize-auth-secret.ps1}
      USER_OPERATOR_EMAIL: ${USER_OPERATOR_EMAIL:?Generate the operator account with scripts/initialize-auth-secret.ps1}
      USER_OPERATOR_PASSWORD: ${USER_OPERATOR_PASSWORD:?Generate the operator account with scripts/initialize-auth-secret.ps1}
    depends_on:
      user-db:
        condition: service_healthy

  catalog-service:
    <<: *java-service
    image: delivery-order-system/catalog-service:local
    build:
      <<: *java-build
      args:
        SERVICE_PATH: services/catalog-service
    environment:
      <<: *java-environment
      SERVER_PORT: 8082
      CATALOG_DB_URL: jdbc:postgresql://catalog-db:5432/catalog
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
    depends_on:
      catalog-db:
        condition: service_healthy

  order-service:
    <<: *java-service
    image: delivery-order-system/order-service:local
    build:
      <<: *java-build
      args:
        SERVICE_PATH: services/order-service
    environment:
      <<: *java-environment
      SERVER_PORT: 8083
      ORDER_DB_URL: jdbc:postgresql://order-db:5432/orders
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME:-orders}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      CATALOG_SERVICE_URL: http://catalog-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
      ORDER_REMOTE_TIMEOUT_MS: ${ORDER_REMOTE_TIMEOUT_MS:-5000}
      # Only the public keys leave the User service; Order fetches them on demand.
      USER_AUTH_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      # Delivery declares its queue on startup; until then the outbox keeps delivery requests pending.
      delivery-service:
        condition: service_healthy
      # Payment calls Order back only per request, so it starts first and the dependency stays one-way.
      payment-service:
        condition: service_healthy

  payment-service:
    <<: *java-service
    image: delivery-order-system/payment-service:local
    build:
      <<: *java-build
      args:
        SERVICE_PATH: services/payment-service
    environment:
      <<: *java-environment
      SERVER_PORT: 8084
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payments
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME:-payments}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_REMOTE_TIMEOUT_MS: ${PAYMENT_REMOTE_TIMEOUT_MS:-3000}
      # Only the public keys leave the User service; Payment fetches them on demand.
      USER_AUTH_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
    depends_on:
      payment-db:
        condition: service_healthy

  delivery-service:
    <<: *java-service
    image: delivery-order-system/delivery-service:local
    build:
      <<: *java-build
      args:
        SERVICE_PATH: services/delivery-service
    environment:
      <<: *java-environment
      SERVER_PORT: 8085
      DELIVERY_DB_URL: jdbc:postgresql://delivery-db:5432/deliveries
      DELIVERY_DB_USERNAME: ${DELIVERY_DB_USERNAME:-deliveries}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD:?Set DELIVERY_DB_PASSWORD in .env}
      ROUTE_INTELLIGENCE_URL: http://route-intelligence-service:8000
      DELIVERY_ROUTE_CONNECT_TIMEOUT_MS: ${DELIVERY_ROUTE_CONNECT_TIMEOUT_MS:-1000}
      DELIVERY_ROUTE_TIMEOUT_MS: ${DELIVERY_ROUTE_TIMEOUT_MS:-3000}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    depends_on:
      delivery-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    <<: *java-service
    image: delivery-order-system/api-gateway:local
    build:
      <<: *java-build
      args:
        SERVICE_PATH: api-gateway
    environment:
      <<: *java-environment
      SERVER_PORT: 8080
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      DELIVERY_SERVICE_URL: http://delivery-service:8085
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy

  web:
    profiles: [demo]
    image: delivery-order-system/web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy

  route-intelligence-service:
    profiles: [demo]
    image: delivery-order-system/route-intelligence-service:local
    build:
      context: .
      dockerfile: services/route-intelligence-service/Dockerfile
    environment:
      ROUTE_INTELLIGENCE_MODEL_PATH: /models
    ports:
      - "127.0.0.1:${ROUTE_INTELLIGENCE_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${ROUTE_INTELLIGENCE_MODEL_DIR:-./services/route-intelligence-service/artifacts/segment-model-v1}
        target: /models
        read_only: true
        bind:
          create_host_path: false

volumes:
  catalog_postgres_data:
  order_postgres_data:
  delivery_postgres_data:
  user_postgres_data:
  payment_postgres_data:
  rabbitmq_data:
