spring.application.name=order-service
order.integration.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8082}
order.integration.delivery-url=${DELIVERY_SERVICE_URL:http://localhost:8085}
order.integration.timeout-ms=${ORDER_REMOTE_TIMEOUT_MS:5000}
server.port=8083
order.auth.secret=${USER_AUTH_SECRET}

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5434/orders}
spring.datasource.username=${ORDER_DB_USERNAME:orders}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info
