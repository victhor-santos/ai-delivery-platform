spring.application.name=order-service
order.integration.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8082}
order.integration.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084}
order.integration.timeout-ms=${ORDER_REMOTE_TIMEOUT_MS:5000}
server.port=8083
order.auth.jwk-set-uri=${USER_AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5434/orders}
spring.datasource.username=${ORDER_DB_USERNAME:orders}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.sql.init.mode=never

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:delivery}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
order.outbox.poll-interval=${ORDER_OUTBOX_POLL_INTERVAL:500ms}
order.outbox.batch-size=50
order.outbox.confirm-timeout=5s

management.endpoints.web.exposure.include=health,info,metrics
logging.pattern.correlation=[%X{requestId:-}] 
