spring.application.name=delivery-service
server.port=8085

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DELIVERY_DB_URL:jdbc:postgresql://localhost:5435/deliveries}
spring.datasource.username=${DELIVERY_DB_USERNAME:deliveries}
spring.datasource.password=${DELIVERY_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.sql.init.mode=never

delivery.routing.url=${ROUTE_INTELLIGENCE_URL:http://localhost:8000}
delivery.routing.connect-timeout-ms=${DELIVERY_ROUTE_CONNECT_TIMEOUT_MS:1000}
delivery.routing.timeout-ms=${DELIVERY_ROUTE_TIMEOUT_MS:3000}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:delivery}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
# Rejections are logged by the listener and the recoverer without the message body.
logging.level.org.springframework.amqp.listener.ConditionalRejectingErrorHandler=ERROR

# Public keys of the User service, the only token issuer.
delivery.auth.jwk-set-uri=${USER_AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

management.endpoints.web.exposure.include=health,info,metrics
logging.pattern.correlation=[%X{requestId:-}] 
