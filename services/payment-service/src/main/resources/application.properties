spring.application.name=payment-service
server.port=8084
payment.integration.order-url=${ORDER_SERVICE_URL:http://localhost:8083}
payment.integration.timeout-ms=${PAYMENT_REMOTE_TIMEOUT_MS:3000}
payment.auth.jwk-set-uri=${USER_AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5437/payments}
spring.datasource.username=${PAYMENT_DB_USERNAME:payments}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info,metrics
logging.pattern.correlation=[%X{requestId:-}] 
